<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dilution, le jeu du fondateur</title>
<meta name="description" content="Un jeu de cartes : vous fondez une startup, levez des fonds, choisissez entre plusieurs term sheets… et découvrez à la vente ce que vous touchez vraiment. Avec les calculs expliqués pas à pas.">
<meta property="og:type" content="website">
<meta property="og:title" content="Dilution, le jeu du fondateur">
<meta property="og:description" content="Fondez une startup, choisissez vos investisseurs, et découvrez ce que vous touchez vraiment à la vente.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b3a8c'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23e2a548'/%3E%3Cpath d='M16 16V5a11 11 0 0 1 10.4 14.6z' fill='%238e9ad8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/jeu.css">
</head>
<body>
<a class="evitement" href="#scene">Aller au jeu</a>
<header class="entete">
  <h1 class="marque">Dilution</h1>
  <div class="calendrier" id="calendrier" aria-live="polite"></div>
  <nav class="menu" aria-label="Outils">
    <button class="bouton-entete" id="btn-tableau" type="button">Tableau de bord</button>
    <button class="bouton-entete" id="btn-journal" type="button">Journal</button>
    <button class="bouton-entete" id="btn-lexique" type="button">Lexique</button>
    <button class="bouton-entete" id="btn-prof" type="button" aria-pressed="false" title="Surligne les pièges et montre toute la dilution, même cachée">Mode prof</button>
  </nav>
</header>

<div class="jauges" id="jauges"></div>

<main class="scene" id="scene" tabindex="-1">
  <section class="situation" aria-live="polite">
    <div class="qui" id="qui"></div>
    <article class="carte" id="carte"></article>
  </section>
  <div class="options" id="options" role="group" aria-label="Vos choix"></div>
  <div class="outils" id="outils"></div>
  <button class="pourquoi" id="pourquoi" type="button" hidden></button>
</main>

<dialog class="fenetre" id="fenetre">
  <div class="fenetre-corps">
    <button class="fermer" type="button" data-fermer aria-label="Fermer">×</button>
    <div id="fenetre-contenu"></div>
  </div>
</dialog>

<footer class="pied">
  Jeu pédagogique : chiffres stylisés, droit simplifié (séries pari passu, pas de fiscalité). Ce n'est pas un conseil juridique ni financier.
  Rien n'est envoyé : tout se calcule dans votre navigateur.
</footer>

<script type="module" src="js/ui.js"></script>
</body>
</html>
